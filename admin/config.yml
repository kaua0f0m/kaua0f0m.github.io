# Configuração do painel do blog (Decap CMS)
# O item marcado com TROCAR depende da sua conta da Cloudflare. Veja PUBLICAR.md.

backend:
  name: github
  repo: kaua0f0m/kaua0f0m.github.io   # repositório público do site (GitHub Pages)
  branch: main
  base_url: https://kaua-cms-auth.SEU-SUBDOMINIO.workers.dev   # TROCAR: endereço do servidor de login (Cloudflare Worker)
  auth_endpoint: auth
  commit_messages:
    create: "Blog: novo post “{{slug}}”"
    update: "Blog: edita “{{slug}}”"
    delete: "Blog: apaga “{{slug}}”"
    uploadMedia: "Blog: envia imagem “{{path}}”"
    deleteMedia: "Blog: apaga imagem “{{path}}”"

# Para testar o painel no seu computador sem login: rode "npx decap-server" na pasta do site.
local_backend: true

locale: pt
publish_mode: simple
site_url: https://kaua0f0m.github.io
display_url: https://kaua0f0m.github.io

media_folder: blog/imagens
public_folder: /blog/imagens

collections:
  - name: posts
    label: Posts
    label_singular: Post
    description: Cada post vira um arquivo em blog/posts. O blog atualiza sozinho alguns minutos depois de salvar.
    folder: blog/posts
    create: true
    extension: md
    format: frontmatter
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    summary: "{{data}} · {{titulo}}"
    sortable_fields: [data, titulo]
    fields:
      - { label: Título, name: titulo, widget: string }
      - { label: Data, name: data, widget: datetime, format: "YYYY-MM-DD", date_format: "DD/MM/YYYY", time_format: false }
      - { label: Resumo, name: resumo, widget: text, required: false, hint: "Uma ou duas frases que aparecem na lista de posts." }
      - { label: Tags, name: tags, widget: list, required: false, default: [], hint: "Separe por vírgula. Ex.: traduções, mods" }
      - { label: Rascunho, name: rascunho, widget: boolean, required: false, default: false, hint: "Rascunhos não aparecem no blog." }
      - { label: Texto, name: body, widget: markdown }
