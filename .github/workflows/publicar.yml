# Publica o site no GitHub Pages a cada mudança na branch main
# (inclusive quando um post é salvo pelo painel /admin).
# Antes de publicar, gera blog/posts.json a partir dos arquivos em blog/posts.
name: Publicar site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publicar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Gerar a lista de posts do blog
        run: node scripts/gerar-lista-blog.mjs

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - id: deploy
        uses: actions/deploy-pages@v4
