<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kauã — terminal</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#070a08; --panel:#0d120f; --line:#1c2a21;
    --green:#3dff8f; --green-dim:#1f8a4e; --amber:#ffc857; --pink:#ff5f9e; --cyan:#5fd7ff;
    --text:#c8f5d8; --muted:#5f7d6a;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    background:var(--bg); color:var(--text);
    font-family:"JetBrains Mono",ui-monospace,monospace; font-size:15px; line-height:1.6;
    background-image:
      radial-gradient(ellipse at 50% -20%, rgba(61,255,143,.12), transparent 60%),
      linear-gradient(rgba(61,255,143,.03) 1px, transparent 1px),
      linear-gradient(90deg, rgba(61,255,143,.03) 1px, transparent 1px);
    background-size:auto, 32px 32px, 32px 32px;
    min-height:100vh; display:flex; flex-direction:column;
  }
  body::after{ /* scanlines */
    content:""; position:fixed; inset:0; pointer-events:none;
    background:repeating-linear-gradient(0deg, rgba(0,0,0,.18) 0 1px, transparent 1px 3px);
    mix-blend-mode:multiply;
  }
  header{
    display:flex; justify-content:space-between; align-items:center;
    padding:18px 28px; border-bottom:1px solid var(--line); gap:16px; flex-wrap:wrap;
  }
  .logo{color:var(--green); font-weight:800; letter-spacing:.5px}
  .logo span{color:var(--muted)}
  nav{display:flex; gap:6px; flex-wrap:wrap}
  nav button{
    font:inherit; font-size:13px; background:none; color:var(--muted); border:1px solid var(--line);
    padding:4px 10px; border-radius:4px; cursor:pointer; transition:.2s;
  }
  nav button:hover{color:var(--green); border-color:var(--green-dim); box-shadow:0 0 12px rgba(61,255,143,.25)}
  main{flex:1; display:grid; grid-template-columns:minmax(0,1.4fr) minmax(0,1fr); gap:28px; padding:36px 28px; max-width:1240px; width:100%; margin:0 auto}
  .window{
    background:var(--panel); border:1px solid var(--line); border-radius:10px; overflow:hidden;
    box-shadow:0 0 0 1px rgba(61,255,143,.05), 0 30px 80px -20px rgba(0,0,0,.8), 0 0 60px -10px rgba(61,255,143,.15);
    display:flex; flex-direction:column; min-height:560px;
  }
  .bar{display:flex; align-items:center; gap:8px; padding:10px 14px; border-bottom:1px solid var(--line); background:#0a0f0c}
  .dot{width:12px;height:12px;border-radius:50%}
  .bar .t{margin-left:10px; color:var(--muted); font-size:12px}
  #term{flex:1; padding:18px 20px; overflow-y:auto; max-height:68vh; cursor:text}
  #term .line{white-space:pre-wrap; word-break:break-word}
  .prompt{color:var(--green)} .path{color:var(--cyan)} .cmd{color:#fff}
  .amber{color:var(--amber)} .pink{color:var(--pink)} .cyan{color:var(--cyan)} .muted{color:var(--muted)} .g{color:var(--green)}
  .big{
    font-size:clamp(28px,5vw,52px); font-weight:800; line-height:1.05; color:var(--green);
    text-shadow:0 0 18px rgba(61,255,143,.55); margin:8px 0 6px; letter-spacing:-1px;
  }
  .inputrow{display:flex; gap:8px; align-items:center}
  #cmd{flex:1; background:none; border:none; outline:none; color:#fff; font:inherit; caret-color:var(--green)}
  .cursor{display:inline-block; width:9px; height:1.1em; background:var(--green); vertical-align:-3px; animation:blink 1s steps(1) infinite}
  @keyframes blink{50%{opacity:0}}
  a{color:var(--cyan)}
  .side{display:flex; flex-direction:column; gap:20px}
  .card{border:1px solid var(--line); border-radius:10px; padding:20px; background:rgba(13,18,15,.7); position:relative}
  .card h3{font-size:12px; color:var(--muted); text-transform:uppercase; letter-spacing:2px; margin-bottom:12px}
  .card h3::before{content:"// "; color:var(--green-dim)}
  .stat{display:flex; justify-content:space-between; padding:6px 0; border-bottom:1px dashed var(--line); font-size:14px}
  .stat:last-child{border:none}
  .bars div{margin:8px 0; font-size:13px}
  .meter{height:8px; background:#0a140e; border:1px solid var(--line); border-radius:2px; margin-top:4px; overflow:hidden}
  .meter i{display:block; height:100%; background:linear-gradient(90deg,var(--green-dim),var(--green)); box-shadow:0 0 10px var(--green); width:0; transition:width 1.4s cubic-bezier(.2,.8,.2,1)}
  .chips{display:flex; flex-wrap:wrap; gap:8px}
  .chips button{font:inherit; font-size:13px; padding:6px 12px; border-radius:6px; border:1px solid var(--green-dim); color:var(--green); background:rgba(61,255,143,.06); cursor:pointer; transition:.15s}
  .chips button:hover{background:var(--green); color:#04140a; box-shadow:0 0 18px rgba(61,255,143,.6)}
  footer{padding:16px 28px; border-top:1px solid var(--line); color:var(--muted); font-size:12px; display:flex; justify-content:space-between; flex-wrap:wrap; gap:8px}
  .status{color:var(--green)} .status::before{content:"●  "; animation:blink 2s steps(1) infinite}
  @media (max-width:860px){
    main{grid-template-columns:1fr; padding:20px 16px}
    header,footer{padding-left:16px; padding-right:16px}
    .window{min-height:440px}
  }
</style>
</head>
<body>
<header>
  <div class="logo">kaua<span>@</span>portfolio<span>:~$</span></div>
  <nav>
    <button data-run="sobre">sobre</button>
    <button data-run="projetos">projetos</button>
    <button data-run="skills">skills</button>
    <button data-run="contato">contato</button>
  </nav>
</header>

<main>
  <section class="window" aria-label="Terminal interativo">
    <div class="bar">
      <span class="dot" style="background:#ff5f57"></span>
      <span class="dot" style="background:#febc2e"></span>
      <span class="dot" style="background:#28c840"></span>
      <span class="t">kaua — zsh — 80×24</span>
    </div>
    <div id="term" role="log" aria-live="polite"></div>
  </section>

  <aside class="side">
    <div class="card">
      <h3>status</h3>
      <div class="stat"><span class="muted">local</span><span>Brasil 🇧🇷</span></div>
      <div class="stat"><span class="muted">idiomas</span><span>PT-BR · EN</span></div>
      <div class="stat"><span class="muted">agora</span><span class="amber">traduzindo jogos</span></div>
      <div class="stat"><span class="muted">disponível</span><span class="status">sim</span></div>
    </div>
    <div class="card bars">
      <h3>skills.load()</h3>
      <div>Tradução / localização<div class="meter"><i data-w="92"></i></div></div>
      <div>Desenvolvimento web<div class="meter"><i data-w="78"></i></div></div>
      <div>Design de interface<div class="meter"><i data-w="70"></i></div></div>
      <div>Modding de jogos<div class="meter"><i data-w="84"></i></div></div>
    </div>
    <div class="card">
      <h3>atalhos</h3>
      <div class="chips">
        <button data-run="help">help</button>
        <button data-run="projetos">ls projetos</button>
        <button data-run="contato">contato</button>
        <button data-run="clear">clear</button>
      </div>
    </div>
  </aside>
</main>

<footer>
  <span>© 2026 Kauã — feito à mão, sem framework.</span>
  <span>dica: digite <span class="g">help</span> no terminal ↵</span>
</footer>

<script>
const term = document.getElementById('term');
const P = '<span class="prompt">kaua</span><span class="muted">@</span><span class="path">~</span><span class="prompt"> $ </span>';
const sleep = ms => new Promise(r => setTimeout(r, ms));
let busy = false;

const out = html => { const d = document.createElement('div'); d.className = 'line'; d.innerHTML = html; term.insertBefore(d, inputRow); term.scrollTop = term.scrollHeight; return d; };

const COMMANDS = {
  help: () => [
    '<span class="amber">comandos disponíveis:</span>',
    '  <span class="g">sobre</span>      quem sou eu',
    '  <span class="g">projetos</span>   coisas que eu fiz',
    '  <span class="g">skills</span>     o que eu sei fazer',
    '  <span class="g">contato</span>    fala comigo',
    '  <span class="g">clear</span>      limpa a tela',
  ],
  sobre: () => [
    'Sou o <span class="g">Kauã</span>, brasileiro, apaixonado por jogos e por palavras.',
    'Traduzo jogos para o <span class="amber">português do Brasil</span> e construo',
    'sites e ferramentas para a internet. Gosto de detalhes,',
    'de interfaces bonitas e de deixar tudo acessível pra galera BR.',
  ],
  projetos: () => [
    '<span class="muted">drwxr-xr-x</span>  <span class="cyan">date-everything-ptbr/</span>  <span class="muted">— tradução completa de um dating sim</span>',
    '<span class="muted">drwxr-xr-x</span>  <span class="cyan">hush-hush-ptbr/</span>        <span class="muted">— localização de visual novel</span>',
    '<span class="muted">drwxr-xr-x</span>  <span class="cyan">voxstage/</span>              <span class="muted">— projeto web autoral</span>',
    '<span class="muted">drwxr-xr-x</span>  <span class="cyan">wheel-ptbr/</span>            <span class="muted">— mais uma tradução no forno</span>',
    '<span class="muted">-rw-r--r--</span>  <span class="pink">em-breve.txt</span>          <span class="muted">— 👀</span>',
  ],
  skills: () => [
    '<span class="amber">[localização]</span>  tradução · revisão · adaptação cultural',
    '<span class="amber">[código]</span>       HTML · CSS · JavaScript · scripts de modding',
    '<span class="amber">[design]</span>       UI · tipografia · identidade visual',
  ],
  contato: () => [
    '📫 email    <a href="mailto:seuemail@exemplo.com">seuemail@exemplo.com</a>',
    '🐙 github   <a href="#">github.com/seuusuario</a>',
    '💬 discord  <span class="cyan">@seuusuario</span>',
  ],
};

async function typeCmd(text){
  const line = out(P + '<span class="cmd"></span>');
  const span = line.querySelector('.cmd');
  for (const ch of text){ span.textContent += ch; await sleep(55 + Math.random()*50); }
  await sleep(180);
}
async function run(raw, typed){
  const c = raw.trim().toLowerCase().replace(/^ls\s+/, '').replace(/^cat\s+/, '').replace(/\.txt$/, '');
  if (!typed) out(P + '<span class="cmd"></span>').querySelector('.cmd').textContent = raw;
  if (!c) return;
  if (c === 'clear'){ [...term.querySelectorAll('.line')].forEach(l => l.remove()); return; }
  if (c === 'whoami'){ out('<div class="big">Oi, eu sou o Kauã!</div>'); return; }
  const f = COMMANDS[c];
  if (!f){ out(`<span class="pink">zsh: comando não encontrado: ${c.replace(/</g,'&lt;')}</span> <span class="muted">— tente "help"</span>`); return; }
  for (const l of f()){ out(l); await sleep(40); }
  out('&nbsp;');
}

const inputRow = document.createElement('div');
inputRow.className = 'inputrow';
inputRow.innerHTML = P + '<input id="cmd" autocomplete="off" spellcheck="false" aria-label="Digite um comando">';
term.appendChild(inputRow);
const cmd = inputRow.querySelector('#cmd');
inputRow.style.visibility = 'hidden';

cmd.addEventListener('keydown', async e => {
  if (e.key === 'Enter' && !busy){ const v = cmd.value; cmd.value=''; busy = true; await run(v, false); busy = false; }
});
term.addEventListener('click', () => cmd.focus());
document.querySelectorAll('[data-run]').forEach(b => b.addEventListener('click', async () => {
  if (busy) return; busy = true; await typeCmd(b.dataset.run); await run(b.dataset.run, true); busy = false; cmd.focus();
}));

(async function boot(){
  busy = true;
  out('<span class="muted">Last login: ' + new Date().toLocaleString('pt-BR') + ' on ttys001</span>');
  await sleep(500);
  await typeCmd('whoami'); await run('whoami', true);
  out('<span class="muted">tradutor de jogos · dev · curioso profissional</span>');
  out('&nbsp;');
  await sleep(400);
  await typeCmd('cat sobre.txt'); await run('sobre', true);
  out('Digite <span class="g">help</span> pra ver o que dá pra fazer por aqui. <span class="cursor"></span>');
  out('&nbsp;');
  inputRow.style.visibility = 'visible';
  busy = false;
})();

setTimeout(() => document.querySelectorAll('.meter i').forEach(i => i.style.width = i.dataset.w + '%'), 300);
</script>
</body>
</html>
