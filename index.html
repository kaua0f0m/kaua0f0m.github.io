<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kauã</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;700;800&family=JetBrains+Mono:wght@400;500&family=VT323&display=swap" rel="stylesheet">
<!-- só os caracteres das saudações em japonês e chinês (usadas se você ligar no Labs) -->
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@800&family=Noto+Sans+SC:wght@800&text=%E3%81%93%E3%82%93%E3%81%AB%E3%81%A1%E3%81%AF%E4%BD%A0%E5%A5%BD&display=swap" rel="stylesheet">
<link rel="stylesheet" href="bolinhas.css">
<style>
  :root{ --bg:#000; --text:#f4f4f4; --muted:#6e6e6e; --line:#1d1d1d; }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:var(--bg)}
  html{scroll-behavior:smooth}
  body{color:var(--text); font-family:"Inter Tight",system-ui,sans-serif; overflow-x:hidden}
  .mono{font-family:"JetBrains Mono",monospace; font-size:12px; letter-spacing:.04em; text-transform:uppercase}
  a{color:inherit; text-decoration:none}
  [hidden]{display:none !important}

  header{display:flex; justify-content:space-between; align-items:center; padding:28px 48px; position:fixed; top:0; left:0; right:0; z-index:10; background:linear-gradient(#000 40%, transparent)}
  .logo{font-weight:800; font-size:20px; letter-spacing:-.03em}
  .logo i{font-style:normal; color:var(--muted)}
  header nav{display:flex; gap:28px}
  header nav a{color:var(--muted); transition:color .2s}
  header nav a:hover{color:var(--text)}

  main{display:grid; grid-template-columns:minmax(0,1fr) minmax(0,1fr); padding:0 48px; gap:24px}
  .left{position:relative; z-index:2; padding:22vh 0 12vh}
  .status{display:inline-flex; align-items:center; gap:10px; color:var(--muted); margin-bottom:36px}
  .status::before{content:""; width:7px; height:7px; border-radius:50%; background:#fff; box-shadow:0 0 0 4px rgba(255,255,255,.12); animation:pulse 2s infinite}
  @keyframes pulse{50%{box-shadow:0 0 0 8px rgba(255,255,255,0)}}
  h1{font-size:clamp(52px,7.6vw,128px); line-height:.9; letter-spacing:-.055em; font-weight:800}
  h1 .dim{color:#3a3a3a; transition:color .6s}
  h1:hover .dim{color:var(--text)}
  h1 .w{display:inline-block; opacity:0; transform:translateY(40px); filter:blur(8px); animation:in 1s cubic-bezier(.2,.8,.2,1) forwards}
  @keyframes in{to{opacity:1; transform:none; filter:none}}
  .lead{margin-top:32px; max-width:460px; font-size:18px; line-height:1.55; color:#9a9a9a}
  .lead b{color:var(--text); font-weight:500}
  .scrollhint{margin-top:56px; color:var(--muted); display:flex; align-items:center; gap:12px}
  .scrollhint::before{content:""; width:1px; height:36px; background:linear-gradient(var(--text),transparent); animation:drop 1.8s infinite}
  @keyframes drop{0%{transform:scaleY(0); transform-origin:top}50%{transform:scaleY(1); transform-origin:top}51%{transform-origin:bottom}100%{transform:scaleY(0); transform-origin:bottom}}

  #projetos{margin-top:22vh; scroll-margin-top:100px}
  .group{margin-bottom:56px}
  .group h2{display:flex; justify-content:space-between; color:var(--muted); padding-bottom:14px; border-bottom:1px solid var(--line)}
  .group h2 b{color:var(--text); font-weight:500}
  .proj{--c:#fff; display:grid; grid-template-columns:14px 1fr 20px; align-items:center; gap:16px; padding:20px 12px 20px 0; border-bottom:1px solid var(--line); position:relative; isolation:isolate; transition:color .25s, padding .35s cubic-bezier(.2,.8,.2,1)}
  .proj::before{content:""; position:absolute; inset:0; background:var(--c); transform:scaleY(0); transform-origin:bottom; transition:transform .35s cubic-bezier(.2,.8,.2,1); z-index:-1}
  .proj .dot{width:9px; height:9px; border-radius:50%; background:var(--c); box-shadow:0 0 12px var(--c); transition:background .25s}
  .proj .t{font-size:24px; font-weight:700; letter-spacing:-.02em; line-height:1.1}
  .proj .d{display:block; font-size:14px; color:#8a8a8a; font-weight:400; letter-spacing:0; margin-top:5px; transition:color .25s}
  .proj .tags{display:flex; gap:6px; flex-wrap:wrap; margin-top:10px; letter-spacing:.04em}
  .proj .tags span.ai{border-style:dashed; border-color:#4a4a4a; color:#c8c8c8}
  .proj.on .tags span.ai{border-color:rgba(0,0,0,.45); color:rgba(0,0,0,.8)}
  .proj .tags span{border:1px solid #2c2c2c; border-radius:999px; padding:3px 9px; font-size:10.5px; color:#9a9a9a; white-space:nowrap; transition:border-color .25s, color .25s}
  .proj .ar{transition:transform .3s}
  /* menu que abre (ex.: Jackbox Games) */
  .proj.parent{width:100%; text-align:left; font:inherit; color:inherit; background:none; border:0; border-bottom:1px solid var(--line); cursor:pointer}
  .proj.parent[aria-expanded=true] .ar, .proj.parent.on[aria-expanded=true] .ar{transform:rotate(180deg)}
  .proj.parent.on .ar{transform:none}
  .kids{display:grid; grid-template-rows:0fr; transition:grid-template-rows .45s cubic-bezier(.2,.8,.2,1)}
  .kids.open{grid-template-rows:1fr}
  .kids > div{overflow:hidden; min-height:0}
  .proj.kid{padding-left:26px}
  .proj.kid.on{padding-left:38px}
  .proj.kid .t{font-size:20px}
  .soon{padding:14px 0 16px 26px; color:#4a4a4a; border-bottom:1px dashed #1d1d1d}
  .proj.on{color:#000; padding-left:14px}
  .proj.on::before{transform:scaleY(1)}
  .proj.on .dot{background:#000; box-shadow:none}
  .proj.on .d{color:rgba(0,0,0,.65)}
  .proj.on .tags span{border-color:rgba(0,0,0,.3); color:rgba(0,0,0,.7)}
  .proj.on .ar{transform:rotate(-45deg)}

  .right{position:sticky; top:0; height:100vh; min-height:480px}
  canvas{position:absolute; inset:0; width:100%; height:100%; cursor:pointer}
  .mon{position:absolute; inset:0; padding:70px 24px 0; cursor:pointer}
  .caption{position:absolute; left:50%; bottom:7%; transform:translateX(-50%); color:var(--muted); display:flex; gap:14px; align-items:center; white-space:nowrap; pointer-events:none}
  .caption b{color:var(--text); font-weight:500}
  .dots{display:flex; gap:6px; transition:opacity .3s}
  .dots i{width:5px; height:5px; border-radius:50%; background:#333; transition:background .3s}
  .dots i.on{background:#fff}
  .caption.proj-mode .dots{opacity:0; width:0; overflow:hidden}

  footer{display:flex; justify-content:space-between; padding:24px 48px 28px; color:var(--muted); gap:16px; flex-wrap:wrap; border-top:1px solid var(--line)}
  footer a:hover{color:var(--text)}
  footer .soc{display:flex; gap:22px}

  @media (max-width:900px){
    header{padding:18px 16px}
    header nav{gap:16px}
    main{grid-template-columns:1fr; padding:0 16px; gap:0}
    .right{order:-1; position:sticky; top:0; height:30vh; min-height:210px; margin:0 -16px; z-index:3; background:#000}
    .right::after{content:""; position:absolute; left:0; right:0; bottom:-48px; height:48px; background:linear-gradient(#000, transparent); pointer-events:none}
    .caption{bottom:4%}
    .mon{padding:58px 0 8px}
    .left{padding:4vh 0 30vh}
    .status{margin-bottom:22px}
    #projetos{margin-top:12vh}
    .proj{grid-template-columns:12px 1fr 18px; gap:12px}
    footer{padding:20px 16px 26px}
  }
  @media (prefers-reduced-motion:reduce){ h1 .w{animation:none; opacity:1; transform:none; filter:none} }
</style>
</head>
<body>
<header>
  <a class="logo" href="#">kauã<i>.</i></a>
  <nav class="mono"><a href="#projetos">Projetos</a><a href="labs.html">Labs</a><a href="https://github.com/kaua0f0m" target="_blank" rel="noopener">GitHub</a></nav>
</header>

<main>
  <section class="left">
    <p class="status mono">Traduções · mods · apps — Brasil</p>
    <h1>
      <span class="w" style="animation-delay:.05s">Oi,</span>
      <span class="w" style="animation-delay:.12s">eu</span>
      <span class="w" style="animation-delay:.19s">sou</span><br>
      <span class="w dim" style="animation-delay:.26s">o</span>
      <span class="w" style="animation-delay:.33s">Kauã!</span>
    </h1>
    <p class="lead">Traduzo jogos para o <b>português do Brasil</b>, faço mods e crio apps. Passe o mouse num projeto e veja as bolinhas mudarem de forma.</p>
    <p class="scrollhint mono">Projetos</p>

    <div id="projetos"></div>
  </section>

  <section class="right" id="stage" aria-label="Esfera 3D feita de pequenas esferas que muda de forma para cada projeto">
    <canvas id="c"></canvas>
    <div class="mon" id="mon" hidden></div>
    <div class="caption mono" id="cap"><span class="dots" id="dots"></span><b id="word">—</b><span id="lang"></span></div>
  </section>
</main>

<footer class="mono">
  <span>© 2026 Kauã</span>
  <span id="clock">Brasil</span>
  <span class="soc"><a href="labs.html">Labs</a><a href="https://github.com/kaua0f0m" target="_blank" rel="noopener">GitHub</a><a href="#">Discord</a></span>
</footer>

<script src="bolinhas.js"></script>
<script>
/* Os projetos, as formas e o motor ficam em bolinhas.js (o mesmo arquivo do Labs). */
(() => {
  const B = Bolinhas, $ = id => document.getElementById(id);
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const touch = matchMedia('(hover: none)').matches;

  /* ---------- monta a lista ---------- */
  const list = $('projetos'), ROWS = [];
  const tagsOf = p => `${p.tags.map(t => `<span>${t}</span>`).join('')}${p.ai ? `<span class="ai">${p.ai === 'sem IA' ? 'feito sem IA' : 'IA · ' + p.ai}</span>` : ''}`;
  function row(p, cls = ''){
    const a = document.createElement('a'); a.className = 'proj ' + cls; a.href = p.url; a.style.setProperty('--c', p.color);
    if (p.url.startsWith('http')){ a.target = '_blank'; a.rel = 'noopener'; }
    a.innerHTML = `<span class="dot"></span><span class="t">${p.name}<span class="d">${p.desc}</span><span class="tags mono">${tagsOf(p)}</span></span><span class="ar">→</span>`;
    return a;
  }
  B.PROJETOS.forEach(g => {
    const sec = document.createElement('div'); sec.className = 'group';
    const n = g.items.reduce((s, p) => s + (p.children ? p.children.length : 1), 0);
    sec.innerHTML = `<h2 class="mono"><b>${g.title}</b><span>${g.note} — ${String(n).padStart(2,'0')}</span></h2>`;
    g.items.forEach(p => {
      if (!p.children){ const el = row(p); ROWS.push({el, p, item:B.byId['p-' + p.key]}); sec.appendChild(el); return; }
      // menu que abre: um jogo por linha, e espaço para os próximos
      const head = document.createElement('button'); head.type = 'button'; head.className = 'proj parent'; head.style.setProperty('--c', p.color);
      head.setAttribute('aria-expanded', 'false');
      const packs = p.children.length + (p.children.length === 1 ? ' jogo' : ' jogos');
      head.innerHTML = `<span class="dot"></span><span class="t">${p.name}<span class="d">${p.desc}</span><span class="tags mono">${p.tags.map(t => `<span>${t}</span>`).join('')}<span class="ai">${packs}</span></span></span><span class="ar">▾</span>`;
      const kids = document.createElement('div'); kids.className = 'kids'; const inner = document.createElement('div'); kids.appendChild(inner);
      head.onclick = () => { const open = head.getAttribute('aria-expanded') !== 'true'; head.setAttribute('aria-expanded', open); kids.classList.toggle('open', open); };
      ROWS.push({el:head, p, item:B.byId['p-' + p.children[0].key]});
      p.children.forEach(c => { const el = row(c, 'kid'); ROWS.push({el, p:c, item:B.byId['p-' + c.key]}); inner.appendChild(el); });
      if (p.soon){ const s = document.createElement('div'); s.className = 'soon mono'; s.textContent = '+ ' + p.soon; inner.appendChild(s); }
      sec.appendChild(head); sec.appendChild(kids);
    });
    list.appendChild(sec);
  });

  /* ---------- bolinhas ou monitor 8-bit (escolhido no Labs) ---------- */
  let cfg = B.loadConfig();
  const right = $('stage'), canvas = $('c'), mon = $('mon'), cap = $('cap'), word = $('word'), lang = $('lang'), dots = $('dots');
  const stage = B.particles(canvas); let screen = null;
  function applyView(){
    const m = cfg.view === 'monitor';
    canvas.hidden = m; cap.hidden = m; mon.hidden = !m; stage.active = !m; stage.style = cfg.style;
    if (m && !screen) screen = B.monitor(mon);
  }
  applyView();
  const show = (it, dur) => cfg.view === 'monitor' ? screen.show(it) : stage.show(it, dur);
  function label(it, isProj){
    word.textContent = it.project ? it.project.name : it.name;
    lang.textContent = it.project ? it.project.tags[0] : it.cat === 'geo' ? 'forma' : it.sub.replace('balão · ', '');
    cap.classList.toggle('proj-mode', !!isProj);
  }

  let rot = null, active = null, leaveTimer = 0;
  function onRot(it, i){
    const n = B.rotationList(cfg).length;
    if (dots.children.length !== n) dots.innerHTML = '<i></i>'.repeat(n);
    [...dots.children].forEach((d, k) => d.classList.toggle('on', k === i));
    if (active) return;
    show(it, 1.7); label(it);
  }

  function activate(r){
    clearTimeout(leaveTimer);
    ROWS.forEach(q => q.el.classList.toggle('on', q === r));
    if (active === r.item) return;
    active = r.item; rot && rot.hold(true);
    show(r.item, 1.15); label(r.item, true);
  }
  function deactivate(){
    if (!active) return; active = null; ROWS.forEach(q => q.el.classList.remove('on'));
    rot && rot.hold(false);
    if (rot && rot.cur){ show(rot.cur, 1.3); label(rot.cur); }   // volta para a forma atual da rotação
    else if (cfg.view !== 'monitor'){ stage.sphere(); word.textContent = '—'; lang.textContent = ''; }
  }
  if (!touch){
    ROWS.forEach(r => { r.el.addEventListener('mouseenter', () => activate(r)); r.el.addEventListener('focus', () => activate(r));
      r.el.addEventListener('mouseleave', () => { clearTimeout(leaveTimer); leaveTimer = setTimeout(deactivate, 350); }); });
  } else {
    // no celular: o projeto no meio da tela é o ativo
    const io = new IntersectionObserver(es => es.forEach(e => { if (e.isIntersecting) activate(ROWS.find(r => r.el === e.target)); }), {rootMargin:'-55% 0px -40% 0px'});
    ROWS.forEach(r => io.observe(r.el));
    const top = new IntersectionObserver(es => es.forEach(e => { if (e.isIntersecting) deactivate(); }), {threshold:.6});
    top.observe(document.querySelector('h1'));
  }
  right.addEventListener('click', () => { if (!active && rot) rot.next(); });

  // mudou algo no Labs (em outra aba)? a inicial acompanha na hora
  addEventListener('storage', e => { if (e.key !== B.KEY) return;
    cfg = B.loadConfig(); applyView();
    const it = active || (rot && rot.cur); if (it) show(it, 1.2); });

  B.ready.then(() => {
    ROWS.forEach(r => setTimeout(() => B.ptsOf(r.item), 50)); // pré-calcula as formas
    rot = B.rotation(() => B.rotationList(cfg), onRot, {speed:() => cfg.speed, extra:() => cfg.view === 'monitor' ? 1 : 1.7, autoplay:!reduce, firstDelay:cfg.view === 'monitor' ? .6 : 3});
  });

  const clock = $('clock');
  const tick = () => clock.textContent = 'Brasil — ' + new Date().toLocaleTimeString('pt-BR', {timeZone:'America/Sao_Paulo', hour:'2-digit', minute:'2-digit'});
  tick(); setInterval(tick, 10000);
})();
</script>
</body>
</html>
