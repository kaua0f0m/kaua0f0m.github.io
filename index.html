<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kauã</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{ --bg:#000; --text:#f4f4f4; --muted:#6e6e6e; --line:#1d1d1d; }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:var(--bg)}
  html{scroll-behavior:smooth}
  body{color:var(--text); font-family:"Inter Tight",system-ui,sans-serif; overflow-x:hidden}
  .mono{font-family:"JetBrains Mono",monospace; font-size:12px; letter-spacing:.04em; text-transform:uppercase}
  a{color:inherit; text-decoration:none}

  header{display:flex; justify-content:space-between; align-items:center; padding:28px 48px; position:fixed; top:0; left:0; right:0; z-index:10; background:linear-gradient(#000 40%, transparent)}
  .logo{font-weight:800; font-size:20px; letter-spacing:-.03em}
  .logo i{font-style:normal; color:var(--muted)}
  header nav{display:flex; gap:28px}
  header nav a{color:var(--muted); transition:color .2s}
  header nav a:hover{color:var(--text)}

  main{display:grid; grid-template-columns:minmax(0,1fr) minmax(0,1fr); padding:0 48px; gap:24px}
  .left{position:relative; z-index:2; padding:22vh 0 12vh}
  .status{display:inline-flex; align-items:center; gap:10px; color:var(--muted); margin-bottom:36px}
  .status::before{content:""; width:7px; height:7px; border-radius:50%; background:#fff; box-shadow:0 0 0 4px rgba(255,255,255,.12); animation:pulse 2s infinite}
  @keyframes pulse{50%{box-shadow:0 0 0 8px rgba(255,255,255,0)}}
  h1{font-size:clamp(52px,7.6vw,128px); line-height:.9; letter-spacing:-.055em; font-weight:800}
  h1 .dim{color:#3a3a3a; transition:color .6s}
  h1:hover .dim{color:var(--text)}
  h1 .w{display:inline-block; opacity:0; transform:translateY(40px); filter:blur(8px); animation:in 1s cubic-bezier(.2,.8,.2,1) forwards}
  @keyframes in{to{opacity:1; transform:none; filter:none}}
  .lead{margin-top:32px; max-width:460px; font-size:18px; line-height:1.55; color:#9a9a9a}
  .lead b{color:var(--text); font-weight:500}
  .scrollhint{margin-top:56px; color:var(--muted); display:flex; align-items:center; gap:12px}
  .scrollhint::before{content:""; width:1px; height:36px; background:linear-gradient(var(--text),transparent); animation:drop 1.8s infinite}
  @keyframes drop{0%{transform:scaleY(0); transform-origin:top}50%{transform:scaleY(1); transform-origin:top}51%{transform-origin:bottom}100%{transform:scaleY(0); transform-origin:bottom}}

  #projetos{margin-top:22vh; scroll-margin-top:100px}
  .group{margin-bottom:56px}
  .group h2{display:flex; justify-content:space-between; color:var(--muted); padding-bottom:14px; border-bottom:1px solid var(--line)}
  .group h2 b{color:var(--text); font-weight:500}
  .proj{--c:#fff; display:grid; grid-template-columns:14px 1fr 20px; align-items:center; gap:16px; padding:20px 12px 20px 0; border-bottom:1px solid var(--line); position:relative; isolation:isolate; transition:color .25s, padding .35s cubic-bezier(.2,.8,.2,1)}
  .proj::before{content:""; position:absolute; inset:0; background:var(--c); transform:scaleY(0); transform-origin:bottom; transition:transform .35s cubic-bezier(.2,.8,.2,1); z-index:-1}
  .proj .dot{width:9px; height:9px; border-radius:50%; background:var(--c); box-shadow:0 0 12px var(--c); transition:background .25s}
  .proj .t{font-size:24px; font-weight:700; letter-spacing:-.02em; line-height:1.1}
  .proj .d{display:block; font-size:14px; color:#8a8a8a; font-weight:400; letter-spacing:0; margin-top:5px; transition:color .25s}
  .proj .tags{display:flex; gap:6px; flex-wrap:wrap; margin-top:10px; letter-spacing:.04em}
  .proj .tags span{border:1px solid #2c2c2c; border-radius:999px; padding:3px 9px; font-size:10.5px; color:#9a9a9a; white-space:nowrap; transition:border-color .25s, color .25s}
  .proj .ar{transition:transform .3s}
  .proj.on{color:#000; padding-left:14px}
  .proj.on::before{transform:scaleY(1)}
  .proj.on .dot{background:#000; box-shadow:none}
  .proj.on .d{color:rgba(0,0,0,.65)}
  .proj.on .tags span{border-color:rgba(0,0,0,.3); color:rgba(0,0,0,.7)}
  .proj.on .ar{transform:rotate(-45deg)}

  .right{position:sticky; top:0; height:100vh; min-height:480px}
  canvas{position:absolute; inset:0; width:100%; height:100%; cursor:pointer}
  .caption{position:absolute; left:50%; bottom:7%; transform:translateX(-50%); color:var(--muted); display:flex; gap:14px; align-items:center; white-space:nowrap; pointer-events:none}
  .caption b{color:var(--text); font-weight:500}
  .dots{display:flex; gap:6px; transition:opacity .3s}
  .dots i{width:5px; height:5px; border-radius:50%; background:#333; transition:background .3s}
  .dots i.on{background:#fff}
  .caption.proj-mode .dots{opacity:0; width:0; overflow:hidden}

  footer{display:flex; justify-content:space-between; padding:24px 48px 28px; color:var(--muted); gap:16px; flex-wrap:wrap; border-top:1px solid var(--line)}
  footer a:hover{color:var(--text)}
  footer .soc{display:flex; gap:22px}

  @media (max-width:900px){
    header{padding:18px 16px}
    header nav{gap:16px}
    main{grid-template-columns:1fr; padding:0 16px; gap:0}
    .right{order:-1; position:sticky; top:0; height:44vh; min-height:300px; margin:0 -16px; z-index:3; background:#000}
    .right::after{content:""; position:absolute; left:0; right:0; bottom:-48px; height:48px; background:linear-gradient(#000, transparent); pointer-events:none}
    .caption{bottom:4%}
    .left{padding:4vh 0 30vh}
    .status{margin-bottom:22px}
    #projetos{margin-top:12vh}
    .proj{grid-template-columns:12px 1fr 18px; gap:12px}
    footer{padding:20px 16px 26px}
  }
  @media (prefers-reduced-motion:reduce){ h1 .w{animation:none; opacity:1; transform:none; filter:none} }
</style>
</head>
<body>
<header>
  <a class="logo" href="#">kauã<i>.</i></a>
  <nav class="mono"><a href="#projetos">Projetos</a><a href="blog.html">Blog</a><a href="https://github.com/kaua0f0m" target="_blank" rel="noopener">GitHub</a></nav>
</header>

<main>
  <section class="left">
    <p class="status mono">Traduções · mods · apps — Brasil</p>
    <h1>
      <span class="w" style="animation-delay:.05s">Oi,</span>
      <span class="w" style="animation-delay:.12s">eu</span>
      <span class="w" style="animation-delay:.19s">sou</span><br>
      <span class="w dim" style="animation-delay:.26s">o</span>
      <span class="w" style="animation-delay:.33s">Kauã!</span>
    </h1>
    <p class="lead">Traduzo jogos para o <b>português do Brasil</b>, faço mods e crio apps. Passe o mouse num projeto e veja as bolinhas mudarem de forma.</p>
    <p class="scrollhint mono">Projetos</p>

    <div id="projetos"></div>
  </section>

  <section class="right" aria-label="Esfera 3D feita de pequenas esferas que muda de forma para cada projeto">
    <canvas id="c"></canvas>
    <div class="caption mono" id="cap"><span class="dots" id="dots"></span><b id="word">—</b><span id="lang"></span></div>
  </section>
</main>

<footer class="mono">
  <span>© 2026 Kauã</span>
  <span id="clock">Brasil</span>
  <span class="soc"><a href="blog.html">Blog</a><a href="https://github.com/kaua0f0m" target="_blank" rel="noopener">GitHub</a><a href="#">Discord</a></span>
</footer>

<script>
/* =====================================================================
   PROJETOS — edite aqui.
   shape: forma feita de bolinhas (veja SHAPES lá embaixo)
   logo:  se quiser usar uma imagem PNG com fundo transparente no lugar
          da forma, coloque o caminho aqui, ex.: logo:'logos/katamari.png'
   ===================================================================== */
const GROUPS = [
  { title:'Traduções & mods', note:'GitHub', items:[
    { name:'Jackbox Party Pack 8', desc:'Tradução PT-BR não oficial, com instalador', tags:['Python','instalador'], color:'#ffcc33', shape:'phone',
      url:'jackbox-8.html' },
    { name:'UNBEATABLE', desc:'Tradução PT-BR (feita por IA) — mod BepInEx', tags:['C#','BepInEx'], color:'#ff4d6d', shape:'notes',
      url:'unbeatable.html' },
    { name:'Katamari Damacy REROLL', desc:'Tradução PT-BR + Katamari Plus', tags:['C#','mod'], color:'#7ddc5a', shape:'katamari',
      url:'katamari.html' },
    { name:'Date Everything!', desc:'Tradução PT-BR (IA + curadoria), instalador sem arquivos do jogo', tags:['Python','instalador'], color:'#ff7eb6', shape:'heart',
      url:'date-everything.html' },
    { name:'Hush Hush', desc:'Tradução PT-BR (IA + curadoria em certas linhas)', tags:['Python','+18'], color:'#a78bfa', shape:'shh',
      url:'hush-hush.html' },
    { name:'HuniePop 2', desc:'Localização PT-BR — plugin BepInEx 5', tags:['C#','BepInEx','+18'], color:'#ffd23f', shape:'bell',
      url:'huniepop-2.html' },
  ]},
  { title:'Standalone', note:'apps', items:[
    { name:'VoxStage', desc:'Karaokê local para Windows, Android e Google TV', tags:['JavaScript','app'], color:'#38e1c6', shape:'mic',
      url:'voxstage.html' },
  ]},
  { title:'Legado', note:'arquivo', items:[
    { name:'Traduções legado', desc:'Todas as traduções antigas reunidas em uma página', tags:['10 jogos'], color:'#9aa4b2', shape:'floppy',
      url:'legado.html' },
  ]},
];
const GREETS = [['Oi!','português'],['Hello!','english'],['Hola!','español'],['Ciao!','italiano'],['Salut!','français'],['Hallo!','deutsch']];

/* ---------- monta a lista ---------- */
const list = document.getElementById('projetos'); const ALL = [];
GROUPS.forEach(g => {
  const sec = document.createElement('div'); sec.className = 'group';
  sec.innerHTML = `<h2 class="mono"><b>${g.title}</b><span>${g.note} — ${String(g.items.length).padStart(2,'0')}</span></h2>`;
  g.items.forEach(p => {
    const a = document.createElement('a'); a.className = 'proj'; a.href = p.url; a.style.setProperty('--c', p.color);
    if (p.url.startsWith('http')){ a.target = '_blank'; a.rel = 'noopener'; }
    a.innerHTML = `<span class="dot"></span><span class="t">${p.name}<span class="d">${p.desc}</span><span class="tags mono">${p.tags.map(t => `<span>${t}</span>`).join('')}</span></span><span class="ar">→</span>`;
    p.el = a; ALL.push(p); sec.appendChild(a);
  });
  list.appendChild(sec);
});

(() => {
  const canvas = document.getElementById('c'), ctx = canvas.getContext('2d');
  const N = 1500;
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const touch = matchMedia('(hover: none)').matches;

  /* ---------- sprites de mini esfera (um por cor) ---------- */
  const sprites = {};
  function sprite(color){
    if (sprites[color]) return sprites[color];
    const SP = 64, c = document.createElement('canvas'); c.width = c.height = SP;
    const g = c.getContext('2d'), r = SP/2, grd = g.createRadialGradient(r*.65, r*.6, r*.05, r, r, r);
    const n = parseInt(color.slice(1), 16), R = n>>16, G = n>>8&255, B = n&255, sh = f => `rgb(${R*f|0},${G*f|0},${B*f|0})`;
    if (color === '#ffffff'){ grd.addColorStop(0,'#fff'); grd.addColorStop(.35,'#d9d9d9'); grd.addColorStop(.8,'#5a5a5a'); grd.addColorStop(1,'#1a1a1a'); }
    else { grd.addColorStop(0,'#fff'); grd.addColorStop(.3, color); grd.addColorStop(.8, sh(.35)); grd.addColorStop(1, '#070707'); }
    g.fillStyle = grd; g.beginPath(); g.arc(r, r, r-1, 0, Math.PI*2); g.fill();
    return sprites[color] = c;
  }

  /* ---------- formas ---------- */
  const rnd = (a,b) => a + Math.random()*(b-a);
  function sphere(n, R = 1){ const a = []; for (let i = 0; i < n; i++){ const y = 1 - 2*(i+.5)/n, r = Math.sqrt(1-y*y), t = i*2.399963; a.push({x:Math.cos(t)*r*R, y:y*R, z:Math.sin(t)*r*R}); } return a; }

  // desenha uma forma 2D num canvas e transforma em "almofada" 3D de bolinhas
  function fromDrawing(draw, n, depth = .3){
    const S = 400, U = 150, a = document.createElement('canvas'); a.width = a.height = S;
    const g = a.getContext('2d'); g.translate(S/2, S/2); g.scale(U, U); g.fillStyle = g.strokeStyle = '#fff'; g.lineCap = 'round'; g.lineJoin = 'round';
    draw(g);
    return fromCanvas(a, n, depth, U);
  }
  function fromCanvas(a, n, depth, U){
    const S = a.width, b = document.createElement('canvas'); b.width = b.height = S;
    const gb = b.getContext('2d'); gb.filter = 'blur(14px)'; gb.drawImage(a, 0, 0);
    const da = a.getContext('2d').getImageData(0,0,S,S).data, db = gb.getImageData(0,0,S,S).data, cand = [];
    for (let y = 0; y < S; y += 2) for (let x = 0; x < S; x += 2){ const i = (y*S+x)*4+3; if (da[i] > 128) cand.push([x, y, db[i]/255]); }
    const out = [];
    for (let i = 0; i < n; i++){
      const [x, y, bl] = cand[(Math.random()*cand.length)|0], d = Math.max(0, (bl - .45)/.55);
      out.push({x:(x - S/2)/U + rnd(-.008,.008), y:-(y - S/2)/U + rnd(-.008,.008), z:(Math.random() < .5 ? -1 : 1)*depth*Math.sqrt(d) + rnd(-.02,.02)});
    }
    return out;
  }
  function fromImage(src, n){
    return new Promise(res => { const img = new Image(); img.onload = () => {
      const S = 400, a = document.createElement('canvas'); a.width = a.height = S; const g = a.getContext('2d');
      const k = Math.min(360/img.width, 300/img.height); g.drawImage(img, (S - img.width*k)/2, (S - img.height*k)/2, img.width*k, img.height*k);
      res(fromCanvas(a, n, .18, 150)); }; img.onerror = () => res(null); img.src = src; });
  }

  function textPoints(word, n, maxW = 1.55, maxH = .68, dy = .04){
    const w = 640, h = 260, c = document.createElement('canvas'); c.width = w; c.height = h;
    const g = c.getContext('2d'); g.fillStyle = '#fff'; g.textAlign = 'center'; g.textBaseline = 'middle';
    g.font = '800 170px "Inter Tight", system-ui, sans-serif'; g.fillText(word, w/2, h/2);
    const d = g.getImageData(0,0,w,h).data, cand = [];
    let minX = w, maxX = 0, minY = h, maxY = 0;
    for (let y = 0; y < h; y += 3) for (let x = 0; x < w; x += 3) if (d[(y*w+x)*4+3] > 128){ cand.push([x,y]); minX = Math.min(minX,x); maxX = Math.max(maxX,x); minY = Math.min(minY,y); maxY = Math.max(maxY,y); }
    const s = Math.min(maxW/(maxX-minX), maxH/(maxY-minY)), cx = (minX+maxX)/2, cy = (minY+maxY)/2, out = [];
    for (let i = 0; i < n; i++){ const [x,y] = cand[(Math.random()*cand.length)|0]; out.push({x:(x-cx)*s + rnd(-.006,.006), y:-(y-cy)*s + dy + rnd(-.006,.006), z:rnd(-.05,.05)}); }
    return out;
  }

  function bubbleOutline(){
    const W = 1.2, H = .66, R = .42, pts = [];
    const arc = (cx, cy, a0, a1) => { for (let i = 0; i <= 16; i++){ const a = a0 + (a1-a0)*i/16; pts.push([cx+Math.cos(a)*R, cy+Math.sin(a)*R]); } };
    pts.push([-.12,-H]); arc(W-R,-H+R,-Math.PI/2,0); arc(W-R,H-R,0,Math.PI/2); arc(-W+R,H-R,Math.PI/2,Math.PI); arc(-W+R,-H+R,Math.PI,Math.PI*1.5);
    pts.push([-.62,-H], [-.86,-1.08], [-.12,-H]);
    const seg = []; let L = 0;
    for (let i = 0; i < pts.length-1; i++){ const d = Math.hypot(pts[i+1][0]-pts[i][0], pts[i+1][1]-pts[i][1]); seg.push(d); L += d; }
    const M = 170, tube = [];
    for (let k = 0; k < M; k++){
      let s = k/M*L, i = 0; while (s > seg[i]) { s -= seg[i]; i++; }
      const [x0,y0] = pts[i], [x1,y1] = pts[i+1], f = s/seg[i], nx = (y1-y0)/seg[i], ny = -(x1-x0)/seg[i], x = x0+(x1-x0)*f, y = y0+(y1-y0)*f;
      for (let j = 0; j < 3; j++){ const a = j/3*Math.PI*2 + k*.7; tube.push({x:x+nx*Math.cos(a)*.055, y:y+ny*Math.cos(a)*.055, z:Math.sin(a)*.055}); }
    }
    return tube;
  }
  const OUTLINE = bubbleOutline();
  const bubbleWith = word => OUTLINE.map(p => ({...p})).concat(textPoints(word, N - OUTLINE.length));

  // formas originais de cada projeto (não são logos oficiais)
  const SHAPES = {
    heart: n => fromDrawing(g => { g.beginPath(); for (let i = 0; i <= 120; i++){ const t = i/120*Math.PI*2, x = 16*Math.sin(t)**3, y = 13*Math.cos(t) - 5*Math.cos(2*t) - 2*Math.cos(3*t) - Math.cos(4*t); g.lineTo(x/14.5, -y/14.5 - .05); } g.fill(); }, n, .38),
    shh: n => OUTLINE.map(p => ({...p})).concat(textPoints('shh…', n - OUTLINE.length)),
    phone: n => fromDrawing(g => {
      g.beginPath(); g.roundRect(-.62,-1.08,1.24,2.16,.22); g.fill();
      g.globalCompositeOperation = 'destination-out'; g.beginPath(); g.roundRect(-.5,-.86,1,1.6,.06); g.fill();
      g.globalCompositeOperation = 'source-over'; g.font = '800 1.15px "Inter Tight"'; g.textAlign = 'center'; g.textBaseline = 'middle'; g.fillText('8', 0, -.02);
      g.beginPath(); g.arc(0,.92,.08,0,7); g.fill();
    }, n, .16),
    notes: n => fromDrawing(g => {
      g.save(); g.translate(-.55,.62); g.rotate(-.4); g.beginPath(); g.ellipse(0,0,.34,.24,0,0,7); g.fill(); g.restore();
      g.save(); g.translate(.62,.42); g.rotate(-.4); g.beginPath(); g.ellipse(0,0,.34,.24,0,0,7); g.fill(); g.restore();
      g.lineWidth = .13; g.beginPath(); g.moveTo(-.25,.55); g.lineTo(-.25,-.78); g.moveTo(.92,.35); g.lineTo(.92,-.98); g.stroke();
      g.beginPath(); g.moveTo(-.31,-.72); g.lineTo(.98,-.94); g.lineTo(.98,-.64); g.lineTo(-.31,-.42); g.closePath(); g.fill();
    }, n, .2),
    mic: n => fromDrawing(g => {
      g.beginPath(); g.roundRect(-.4,-1.15,.8,1.2,.4); g.fill();
      g.globalCompositeOperation = 'destination-out'; g.lineWidth = .05; g.beginPath();
      for (const y of [-.75,-.55,-.35]){ g.moveTo(-.45,y); g.lineTo(.45,y); } g.stroke();
      g.globalCompositeOperation = 'source-over'; g.lineWidth = .12;
      g.beginPath(); g.arc(0,-.3,.66,.05,Math.PI-.05); g.stroke();
      g.beginPath(); g.moveTo(0,.36); g.lineTo(0,.88); g.moveTo(-.42,.92); g.lineTo(.42,.92); g.stroke();
    }, n, .3),
    bell: n => fromDrawing(g => {
      // sino: cúpula, aba larga embaixo, badalo e argola em cima
      g.beginPath(); g.moveTo(-.72,.55); g.quadraticCurveTo(-.7,-.95,0,-.95); g.quadraticCurveTo(.7,-.95,.72,.55);
      g.lineTo(.92,.66); g.lineTo(-.92,.66); g.closePath(); g.fill();
      g.beginPath(); g.arc(0,.84,.17,0,Math.PI*2); g.fill();
      g.lineWidth = .1; g.beginPath(); g.arc(0,-1.06,.13,0,Math.PI*2); g.stroke();
      g.globalCompositeOperation = 'destination-out'; g.lineWidth = .06;
      g.beginPath(); g.moveTo(-.66,.36); g.lineTo(.66,.36); g.stroke();
    }, n, .32),
    gem: n => fromDrawing(g => {
      g.beginPath(); g.moveTo(-.55,-.8); g.lineTo(.55,-.8); g.lineTo(1.05,-.25); g.lineTo(0,1.05); g.lineTo(-1.05,-.25); g.closePath(); g.fill();
      g.globalCompositeOperation = 'destination-out'; g.lineWidth = .06; g.beginPath();
      g.moveTo(-1.05,-.25); g.lineTo(1.05,-.25); g.moveTo(-.55,-.8); g.lineTo(-.3,-.25); g.lineTo(0,1.05); g.lineTo(.3,-.25); g.lineTo(.55,-.8);
      g.moveTo(0,-.8); g.lineTo(-.3,-.25); g.moveTo(0,-.8); g.lineTo(.3,-.25); g.stroke();
    }, n, .3),
    floppy: n => fromDrawing(g => {
      g.beginPath(); g.moveTo(-.95,-.95); g.lineTo(.7,-.95); g.lineTo(.95,-.7); g.lineTo(.95,.95); g.lineTo(-.95,.95); g.closePath(); g.fill();
      g.globalCompositeOperation = 'destination-out';
      g.fillRect(-.56,-.95,1.02,.66);                                  // vão em volta da tampa de metal
      g.beginPath(); g.roundRect(-.68,.06,1.36,.89,.08); g.fill();    // etiqueta
      g.globalCompositeOperation = 'source-over';
      g.fillRect(-.47,-.95,.84,.56);                                   // tampa de metal
      g.lineWidth = .08; g.beginPath(); g.moveTo(-.5,.36); g.lineTo(.5,.36); g.moveTo(-.5,.62); g.lineTo(.28,.62); g.stroke();
      g.globalCompositeOperation = 'destination-out'; g.fillRect(.1,-.88,.2,.4); // fenda
    }, n, .14),
    katamari: n => { // bola 3D com objetos grudados
      const core = sphere(Math.floor(n*.55), .72), out = [...core]; let left = n - core.length;
      while (left > 0){
        const u = rnd(-1,1), t = rnd(0,Math.PI*2), r = Math.sqrt(1-u*u), dir = [Math.cos(t)*r, u, Math.sin(t)*r];
        if (Math.random() < .55){ const R = rnd(.1,.2), c = dir.map(v => v*(.72+R*.7)), k = Math.min(left, 40|0);
          for (const p of sphere(k, R)) out.push({x:c[0]+p.x, y:c[1]+p.y, z:c[2]+p.z}); left -= k; }
        else { const L = rnd(.35,.6), k = Math.min(left, 22);
          for (let i = 0; i < k; i++){ const s = .68 + L*i/k; out.push({x:dir[0]*s+rnd(-.02,.02), y:dir[1]*s+rnd(-.02,.02), z:dir[2]*s+rnd(-.02,.02)}); } left -= k; }
      }
      return out;
    },
  };

  /* ---------- partículas ---------- */
  const SPHERE = sphere(N), WHITE = '#ffffff';
  const P = SPHERE.map(p => ({fx:p.x, fy:p.y, fz:p.z, tx:p.x, ty:p.y, tz:p.z, x:p.x, y:p.y, z:p.z, d:0, ph:Math.random()*6.28, sa:WHITE, sb:WHITE}));
  let morphT = 1, morphDur = 1.7, mode = 'sphere', active = null, faceFront = false, spin = false;
  let ry = 0, rz = 0, gi = -1, holdT = 0;

  function morphTo(target, color = WHITE, dur = 1.7){
    const key = p => p.x + p.y*.25;
    const cur = P.slice().sort((a,b) => key(a) - key(b)), tg = target.slice().sort((a,b) => key(a) - key(b));
    const spread = dur < 1.5 ? .2 : .3;
    cur.forEach((p,i) => { p.sa = p.k > .5 ? p.sb : p.sa; p.fx = p.x; p.fy = p.y; p.fz = p.z;
      p.tx = tg[i].x; p.ty = tg[i].y; p.tz = tg[i].z; p.sb = color; p.d = (i/N)*spread + Math.random()*.1; p.k = 0; });
    morphT = 0; morphDur = dur; holdT = 0;
  }

  const cap = document.getElementById('cap'), word = document.getElementById('word'), lang = document.getElementById('lang'), dots = document.getElementById('dots');
  dots.innerHTML = GREETS.map(() => '<i></i>').join('');
  function label(a, b, isProj){ word.textContent = a; lang.textContent = b; cap.classList.toggle('proj-mode', !!isProj); }

  function nextGreeting(){
    if (mode === 'sphere'){ gi = (gi+1) % GREETS.length; mode = 'bubble'; faceFront = true; morphTo(bubbleWith(GREETS[gi][0]));
      label(GREETS[gi][0], GREETS[gi][1]); [...dots.children].forEach((d,i) => d.classList.toggle('on', i === gi)); }
    else { mode = 'sphere'; faceFront = false; morphTo(SPHERE); label('—', ''); }
  }

  // cache de formas por projeto
  const cache = new Map();
  async function shapeOf(p){
    if (cache.has(p)) return cache.get(p);
    let pts = p.logo ? await fromImage(p.logo, N) : null;
    if (!pts) pts = SHAPES[p.shape](N);
    cache.set(p, pts); return pts;
  }

  let leaveTimer = 0;
  async function activate(p){
    clearTimeout(leaveTimer);
    if (active === p) return;
    active = p; ALL.forEach(q => q.el.classList.toggle('on', q === p));
    const pts = await shapeOf(p); if (active !== p) return;
    mode = 'project'; faceFront = p.shape !== 'katamari' || !!p.logo; spin = p.shape === 'katamari' && !p.logo;
    morphTo(pts, p.color, 1.15); label(p.name, p.tags[0], true);
  }
  function deactivate(){
    if (!active) return; active = null; ALL.forEach(q => q.el.classList.remove('on'));
    mode = 'sphere'; faceFront = false; spin = false; morphTo(SPHERE, WHITE, 1.3); label('—', ''); holdT = 0;
  }

  if (!touch){
    ALL.forEach(p => { p.el.addEventListener('mouseenter', () => activate(p)); p.el.addEventListener('focus', () => activate(p));
      p.el.addEventListener('mouseleave', () => { clearTimeout(leaveTimer); leaveTimer = setTimeout(deactivate, 350); }); });
  } else {
    // no celular: o projeto no meio da tela é o ativo
    const io = new IntersectionObserver(es => es.forEach(e => { if (e.isIntersecting) activate(ALL.find(p => p.el === e.target)); }), {rootMargin:'-55% 0px -40% 0px'});
    ALL.forEach(p => io.observe(p.el));
    const top = new IntersectionObserver(es => es.forEach(e => { if (e.isIntersecting) deactivate(); }), {threshold:.6});
    top.observe(document.querySelector('h1'));
  }
  canvas.addEventListener('click', () => { if (mode !== 'project') nextGreeting(); });

  /* ---------- render ---------- */
  let mx = 0, my = 0, tmx = 0, tmy = 0;
  addEventListener('pointermove', e => { const r = canvas.getBoundingClientRect(); tmx = Math.max(-1, Math.min(1, ((e.clientX - r.left)/r.width - .5)*2)); tmy = Math.max(-1, Math.min(1, ((e.clientY - r.top)/r.height - .5)*2)); });

  let W = 0, H = 0;
  function resize(){ const dpr = Math.min(devicePixelRatio || 1, 2); W = canvas.clientWidth; H = canvas.clientHeight; canvas.width = W*dpr; canvas.height = H*dpr; ctx.setTransform(dpr,0,0,dpr,0,0); }
  addEventListener('resize', resize); resize();

  const ease = t => t < .5 ? 4*t*t*t : 1 - Math.pow(-2*t+2, 3)/2;
  const order = new Array(N); let last = 0, time = 0;
  const TAU = Math.PI*2, nearest = v => Math.round(v/TAU)*TAU;

  function frame(now){
    const dt = Math.min((now - last)/1000, .05); last = now; time += dt;
    mx += (tmx - mx)*.05; my += (tmy - my)*.05;

    if (morphT < 1) morphT = Math.min(1, morphT + dt/morphDur);
    else if (mode !== 'project'){ holdT += dt; if (!reduce && holdT > (mode === 'sphere' ? 3 : 3.4)) nextGreeting(); }

    if (!faceFront) ry += dt*(spin ? .9 : .45); else ry += (nearest(ry) - ry)*Math.min(1, dt*2.6);
    if (spin) rz += dt*.6; else rz += (nearest(rz) - rz)*Math.min(1, dt*2);
    const wob = faceFront ? Math.sin(time*1.3)*.1 : 0;
    const a = ry + wob + mx*.35, b = -.18 + my*.25 + (faceFront ? Math.sin(time*.9)*.05 : 0);
    const ca = Math.cos(a), sa = Math.sin(a), cb = Math.cos(b), sb = Math.sin(b), cz = Math.cos(rz), sz = Math.sin(rz);

    const S = Math.min(W, H) * (W < 600 ? .34 : .33), cx = W/2, cy = H/2 - H*.02;
    const spread = morphDur < 1.5 ? .2 : .3, win = 1 - spread - .1;
    for (let i = 0; i < N; i++){
      const p = P[i];
      const k = p.k = ease(Math.max(0, Math.min(1, (morphT - p.d)/win)));
      const burst = Math.sin(k*Math.PI) * .3;
      p.x = p.fx + (p.tx - p.fx)*k; p.y = p.fy + (p.ty - p.fy)*k; p.z = p.fz + (p.tz - p.fz)*k;
      const br = 1 + burst*.6 + (mode === 'sphere' && morphT >= 1 ? Math.sin(time*2 + p.ph)*.012 : 0);
      let x = p.x*br, y = p.y*br, z = p.z*br + burst*Math.sin(p.ph)*.4;
      const x0 = x*cz - y*sz, y0 = x*sz + y*cz;
      const x1 = x0*ca - z*sa, z1 = x0*sa + z*ca;
      const y1 = y0*cb - z1*sb, z2 = y0*sb + z1*cb;
      const f = 3.4/(3.4 - z2);
      p.sx = cx + x1*S*f; p.sy = cy - y1*S*f; p.sz = z2; p.sf = f;
      order[i] = i;
    }
    order.sort((i,j) => P[i].sz - P[j].sz);

    ctx.clearRect(0,0,W,H);
    const glowC = active ? active.color : '#ffffff', n = parseInt(glowC.slice(1),16);
    const glow = ctx.createRadialGradient(cx, cy, 0, cx, cy, S*1.6);
    glow.addColorStop(0, `rgba(${n>>16},${n>>8&255},${n&255},${active ? .1 : .06})`); glow.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.fillStyle = glow; ctx.fillRect(0,0,W,H);

    const base = S*.055, small = mode !== 'sphere' && morphT > .6 ? .82 : 1;
    for (let j = 0; j < N; j++){
      const p = P[order[j]], s = base*p.sf*small;
      ctx.globalAlpha = Math.max(.12, Math.min(1, .55 + p.sz*.5));
      ctx.drawImage(sprite(p.k > .5 ? p.sb : p.sa), p.sx - s/2, p.sy - s/2, s, s);
    }
    ctx.globalAlpha = 1;
    requestAnimationFrame(frame);
  }

  (document.fonts ? document.fonts.ready : Promise.resolve()).then(() => {
    ALL.forEach(p => setTimeout(() => shapeOf(p), 50)); // pré-calcula as formas
    requestAnimationFrame(t => { last = t; frame(t); });
  });

  const clock = document.getElementById('clock');
  const tick = () => clock.textContent = 'Brasil — ' + new Date().toLocaleTimeString('pt-BR', {timeZone:'America/Sao_Paulo', hour:'2-digit', minute:'2-digit'});
  tick(); setInterval(tick, 10000);
})();
</script>
</body>
</html>
