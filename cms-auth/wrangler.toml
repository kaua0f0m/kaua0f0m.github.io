# Servidor de login do painel do blog (Cloudflare Worker)
# Publicar: na pasta cms-auth, rode "npx wrangler deploy". Veja PUBLICAR.md.
name = "kaua-cms-auth"
main = "worker.js"
compatibility_date = "2026-10-01"

[vars]
# Endereço(s) do site que podem usar o login, separados por vírgula. O localhost serve para testar.
ALLOWED_ORIGINS = "https://kaua0f0m.github.io,http://localhost:5517"
# Repositório público: só precisa de public_repo. Para privado, troque por "repo".
SCOPE = "public_repo"
